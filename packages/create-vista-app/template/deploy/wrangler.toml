name = "my-vista-app"
compatibility_date = "2026-09-20"
main = ".vista/deploy/cloudflare/worker.js"

[vars]
VISTA_RUNTIME = "standalone"

[[containers]]
class_name = "VistaSSR"
image = "./Dockerfile"
max_instances = 4

[[durable_objects.bindings]]
name = "VISTA_SSR"
class_name = "VistaSSR"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VistaSSR"]
