name: Bench Platform Gate

on:
  pull_request:
  push:
    branches:
      - main
      - development

jobs:
  bench-platform-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Bench Platform Gate
        run: npm run test:bench:platform-gate
